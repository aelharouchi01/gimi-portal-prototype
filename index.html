<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIMI Partner Portal — prototype</title>
<link rel="icon" href="gimi-logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!--
  Clickable prototype. No server, no database, no network calls.
  State lives in memory, so a refresh resets everything. That is deliberate:
  it is what separates this from the product in ../app.
-->
<div id="proto-bar">
  <strong>Prototype</strong>
  <span>not connected to a database, a refresh resets it</span>
  <span class="spacer"></span>
  <span id="proto-role">not signed in</span>
  <button data-action="signin-admin">GIMI staff view</button>
  <button data-action="signin-partner">Partner view</button>
  <button onclick="location.reload()">Reset</button>
</div>

<div id="root"></div>

<!-- real-data.js is generated from GIMI's workbooks and must load first. -->
<script src="real-data.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
